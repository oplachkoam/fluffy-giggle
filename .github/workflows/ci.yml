name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  NODE_VERSION: "26.9.0"
  # The registry id may live in Variables or in Secrets; the key is always a secret.
  REGISTRY_ID: ${{ vars.YC_CR_REGISTRY_ID || secrets.YC_CR_REGISTRY_ID }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: core
      - name: generated code is committed
        working-directory: core
        run: |
          go tool sqlc generate
          go generate ./internal/...
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run typecheck
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - working-directory: core
        run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test

  docker:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: registry id is set
        run: |
          test -n "$REGISTRY_ID" || { echo "::error::YC_CR_REGISTRY_ID is not set in repository Variables or Secrets"; exit 1; }
          echo "IMAGE=cr.yandex/$REGISTRY_ID/fluffy-giggle" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Yandex Container Registry rejects OCI manifests with attestations.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
